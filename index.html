<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>List dla Malinki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --scene-bg:url("w.png");
    --fog:#141d1f;
    --rose:#c9527f;
    --parchment:#f1e3c2;
    --parchment-2:#e2cf9c;
    --wax:#7c2030;
    --wax-dark:#4c1420;
    --ink:#5c3a2a;
  }
  html,body{height:100%; margin:0;}
  *{box-sizing:inherit;}
  body{font-family:'Fredoka',sans-serif; overflow:hidden; color:#f1e3c2;}
  .page{height:100%; display:flex; flex-direction:column;}

  /* header */
  .promo{
    background:linear-gradient(90deg,#5f7fc7,var(--rose));
    color:#fff; text-align:center; font-size:0.82rem;
    padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; background:var(--fog); padding:10px 5vw;
  }
  .logo{font-size:1.25rem; color:#f1e3c2;}
  .logo span{color:var(--rose);}
  .nav-links{display:flex; gap:16px; font-size:0.85rem; color:#c9d2c4; opacity:0.8;}
  .nav-actions{display:flex; gap:10px;}
  .btn-play,.btn-login{
    font-family:inherit; font-size:0.85rem; padding:7px 16px; border-radius:20px; cursor:default;
  }
  .btn-play{background:var(--rose); color:#fff; border:none;}
  .btn-login{background:transparent; border:1px solid #c9d2c4; color:#c9d2c4;}
  @media (max-width:640px){ .nav-links,.btn-login{display:none;} }

  /* scene */
  .scene{flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .bg-blur,.bg-sharp{position:absolute; inset:0; background-image:var(--scene-bg); background-size:cover; background-position:center 42%;}
  .bg-blur{filter:blur(9px) brightness(0.6) saturate(1.05);}
  .bg-sharp{
    filter:brightness(0.74) saturate(1.05);
    mask-image:radial-gradient(ellipse 42% 40% at 50% 46%, #000 45%, transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse 42% 40% at 50% 46%, #000 45%, transparent 78%);
  }
  .vignette{position:absolute; inset:0; background:radial-gradient(ellipse 65% 60% at 50% 45%, rgba(0,0,0,0) 0%, rgba(6,8,10,.55) 80%, rgba(4,5,7,.75) 100%);}
  .sparkle{position:absolute; opacity:0; pointer-events:none; font-size:0.85rem; animation:twinkle 5s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:0; transform:translateY(0) scale(0.8);} 50%{opacity:.85; transform:translateY(-8px) scale(1);}}

  /* mail */
  .mail{position:relative; z-index:2; width:min(82vw,300px); height:min(82vw,220px); perspective:900px; cursor:pointer; outline:none;}
  .mail:focus-visible{outline:2px solid var(--rose); outline-offset:6px;}

  .folded-letter{
    position:absolute; inset:6% 5%; z-index:1; overflow:hidden;
    background:linear-gradient(160deg,var(--parchment),var(--parchment-2));
    border-radius:6px; box-shadow:0 10px 25px rgba(0,0,0,.4);
    transform:scaleY(0.22); transform-origin:center;
    transition:transform .7s ease-out;
  }
  .folded-letter.unfold{transform:scaleY(1);}
  .crease{position:absolute; left:8%; right:8%; top:50%; height:2px; background:rgba(0,0,0,.22); transform:translateY(-50%); transition:opacity .3s;}
  .folded-letter.unfold .crease{opacity:0;}
  .letter-content{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:8%; opacity:0; transform:translateY(10px);
    transition:opacity .5s, transform .5s;
  }
  .folded-letter.reveal .letter-content{opacity:1; transform:translateY(0);}
  .coin-img{width:92px; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)); margin-bottom:8px;}
  .amount{font-size:2.4rem; font-weight:600; color:var(--wax-dark); line-height:1;}
  .sc-label{font-size:0.8rem; letter-spacing:0.5px; color:var(--ink); margin-top:2px;}
  .sign{font-family:'Caveat',cursive; font-size:1.8rem; color:#6b3b46; margin-top:10px;}

  .envelope{position:absolute; inset:0; z-index:3; transition:transform .6s ease-in, opacity .6s ease-in;}
  .envelope.falling{transform:translateY(55px) scale(.92); opacity:0;}
  .env-body{position:absolute; left:0; right:0; bottom:0; top:0%; background:linear-gradient(160deg,#8a6a45,#6b4d30); border-radius:0 0 10px 10px; box-shadow:0 15px 30px rgba(0,0,0,.45);}
  .env-flap{
    position:absolute; top:20; left:0; width:100%; height:60%;
    background:linear-gradient(160deg,#9c7a52,#7a5a38);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:50% 0%; transition:transform .6s ease-in;
  }
  .envelope.flap-open .env-flap{transform:rotateX(-165deg);}

  .seal{
    position:absolute; top:55%; left:50%; transform:translate(-50%,-50%);
    width:65px; height:65px; border-radius:50%; z-index:4;
    background:radial-gradient(circle at 35% 30%, #a4425a, var(--wax) 60%, var(--wax-dark) 100%);
    box-shadow:0 4px 8px rgba(0,0,0,.4), inset 0 -3px 6px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    font-family:'Caveat',cursive; font-size:1.6rem; color:#f1d9c9;
    transition:transform .4s ease-in, opacity .4s ease-in;
  }
  .envelope.seal-broken .seal{transform:translate(-50%,-50%) scale(.25) rotate(35deg); opacity:0;}

  @media (prefers-reduced-motion: reduce){
    .envelope,.env-flap,.seal,.folded-letter,.crease,.letter-content{transition:none !important;}
    .sparkle{animation:none; opacity:.5;}
  }
</style>
</head>
<body>
<div class="page">


  <main class="scene" id="scene">
    <div class="bg-blur"></div>
    <div class="bg-sharp"></div>
    <div class="vignette"></div>

    <div class="mail" id="mail" tabindex="0" role="button" aria-label="Otwórz list">
      <div class="folded-letter" id="foldedLetter">
        <div class="crease"></div>
        <div class="letter-content">
          <img class="coin-img" src="sc.png" alt="stos gwiezdnych monet">
          <div class="amount">1000</div>
          <div class="sc-label">Star Coins</div>
          <div class="sign">dla Malinki 💜</div>
        </div>
      </div>
      <div class="envelope" id="envelope">
        <div class="env-body"></div>
        <div class="env-flap"></div>
        <div class="seal" id="seal"><span>M</span></div>
      </div>
    </div>
  </main>
</div>

<script>
  const scene = document.getElementById('scene');
  const mail = document.getElementById('mail');
  const envelope = document.getElementById('envelope');
  const foldedLetter = document.getElementById('foldedLetter');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const glyphs = ['⋆','✦','·'];
  for(let i=0;i<12;i++){
    const s=document.createElement('span');
    s.className='sparkle';
    s.textContent=glyphs[Math.floor(Math.random()*glyphs.length)];
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*70+'%';
    s.style.animationDelay=(Math.random()*5)+'s';
    s.style.color = Math.random()>0.5 ? '#7fd8d0' : '#e3ab52';
    scene.appendChild(s);
  }

  let opened = false;
  function openLetter(){
    if(opened) return;
    opened = true;
    const d = reduced ? 0 : 1;
    envelope.classList.add('seal-broken');
    setTimeout(()=> envelope.classList.add('flap-open'), 350*d);
    setTimeout(()=> envelope.classList.add('falling'), 950*d);
    setTimeout(()=> foldedLetter.classList.add('unfold'), 1150*d);
    setTimeout(()=> foldedLetter.classList.add('reveal'), 1650*d);
  }
  mail.addEventListener('click', openLetter);
  mail.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openLetter(); }
  });
</script>
</body>
</html>
